name: Validate agent

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run public-set evaluator when catalog is available
        run: |
          if [[ ! -f data/catalog.jsonl ]]; then
            echo "::notice title=Public evaluator skipped::data/catalog.jsonl is intentionally not stored in Git. Add it to the runner to enable this benchmark."
            exit 0
          fi
          python -m evaluator.local_evaluator

      - name: Upload evaluator results
        if: ${{ always() && hashFiles('results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-results
          path: results.json
